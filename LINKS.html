<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Tatuaje 3D | Broder Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --panel-border: #242424;
            --panel-hover: #1e1e1e;
            --text-primary: #f5f5f5;
            --text-muted: #8e8e93;
            --accent: #ffffff;
            --danger: #e54d42;
            --danger-bg: rgba(229, 77, 66, 0.1);
            --whatsapp-color: #25D366;
            --font-main: 'Helvetica Neue', 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .simulator-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 1180px;
            position: relative;
        }

        /* Canvas Wrapper */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            min-height: 420px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #webgl-container.dragging {
            cursor: grabbing;
        }

        /* Botón Cargar Flotante (Mobile) */
        .floating-upload-btn {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .floating-upload-btn:hover {
            transform: scale(1.03);
            background: #ffffff;
        }

        .floating-upload-btn svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        /* Panel Lateral de Controls */
        .controls {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-badge {
            font-size: 0.75rem;
            color: var(--text-primary);
            font-weight: 600;
            background: #202020;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        input[type="file"] { display: none; }

        /* Sliders */
        .range-slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #282828;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        input[type="range"]:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Botones de Acción */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: transparent;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid rgba(229, 77, 66, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--danger-bg);
            border-color: var(--danger);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp:hover {
            background-color: #20bd5a;
            transform: translateY(-1px);
        }

        .status-loader {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-primary);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .instruction-tag {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .divider {
            border: 0;
            height: 1px;
            background: var(--panel-border);
        }

        /* Desktop Adjustments */
        @media (min-width: 860px) {
            .simulator-container { flex-direction: row; }
            .controls { width: 320px; flex-shrink: 0; height: fit-content; }
            .canvas-wrapper { flex: 1; height: 680px; }
            .floating-upload-btn {
                position: relative;
                bottom: auto;
                left: auto;
                border-radius: 8px;
                width: 100%;
                justify-content: center;
                background: #1e1e1e;
                color: var(--text-primary);
                border: 1px solid var(--panel-border);
                padding: 12px;
                box-shadow: none;
            }
            .floating-upload-btn:hover {
                background: #2a2a2a;
            }
            .floating-upload-btn svg { fill: var(--text-primary); }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <header>
        <h1>Simulador de Tatuajes 3D</h1>
        <p>Proyección Anatómica en Tiempo Real — Broder Academy</p>
    </header>

    <div class="simulator-container">
        
        <!-- Canvas Viewer -->
        <main class="canvas-wrapper">
            <div id="statusLoader" class="status-loader">Cargando modelo...</div>
            <div class="instruction-tag">Arrastra sobre la piel para ubicar | Rota con 2 dedos / mouse</div>
            <div id="webgl-container"></div>

            <!-- Botón flotante para subir imágen en Mobile / Integrado en Desktop -->
            <label for="tattooInput" class="floating-upload-btn">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <span id="tattooLabel">Subir Tatuaje</span>
            </label>
            <input type="file" id="tattooInput" accept="image/png, image/jpeg, image/webp">
        </main>

        <!-- Controles -->
        <aside class="controls">

            <div class="control-section">
                <div class="section-title">
                    <span>Tamaño / Escala</span>
                    <span id="valScale" class="value-badge">25%</span>
                </div>
                <div class="range-slider">
                    <input type="range" id="scale" min="0.05" max="0.8" step="0.01" value="0.25" disabled>
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">
                    <span>Rotación</span>
                    <span id="valRotate" class="value-badge">0°</span>
                </div>
                <div class="range-slider">
                    <input type="range" id="rotate" min="0" max="360" value="0" disabled>
                </div>
            </div>

            <hr class="divider">

            <button id="btnRemove" class="btn-action btn-danger" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Eliminar Tatuaje
            </button>

            <!-- Botón directo a WhatsApp -->
            <button id="btnWhatsapp" class="btn-action btn-whatsapp">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                Enviar por WhatsApp
            </button>
        </aside>
    </div>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('webgl-container');
    const statusLoader = document.getElementById('statusLoader');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x141414);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0.9, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.9, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff8ee, 1.3);
    dirLight1.position.set(2, 4, 3);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xebf2ff, 0.6);
    dirLight2.position.set(-2, 2, -3);
    scene.add(dirLight2);

    let humanMesh = null;
    let customModelGroup = null;
    let tattooTexture = null;
    let decalMesh = null;
    let isDraggingTattoo = false;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let lastHitPoint = null;
    let lastHitNormal = null;

    // Opacidad fija al 85%
    const decalParams = { scale: 0.25, rotation: 0, opacity: 0.85 };

    const tattooInput = document.getElementById('tattooInput');
    const tattooLabel = document.getElementById('tattooLabel');
    const scaleInput = document.getElementById('scale');
    const rotateInput = document.getElementById('rotate');
    const btnRemove = document.getElementById('btnRemove');
    const btnWhatsapp = document.getElementById('btnWhatsapp');

    const valScale = document.getElementById('valScale');
    const valRotate = document.getElementById('valRotate');

    const gltfLoader = new GLTFLoader();
    const DEFAULT_MODEL_URL = 'https://cdn.jsdelivr.net/gh/marianocabraltattoo/broderacademy@0b6625f3c005149981e2f7f916e48cf34b8ddb2a/sculpting_a_human_body.glb';

    function setupLoadedModel(gltfGroup) {
        if (customModelGroup) scene.remove(customModelGroup);
        if (humanMesh) scene.remove(humanMesh);

        customModelGroup = gltfGroup;

        const box = new THREE.Box3().setFromObject(customModelGroup);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.0 / maxDim;
        customModelGroup.scale.setScalar(scale);

        box.setFromObject(customModelGroup);
        box.getCenter(center);
        customModelGroup.position.sub(center);
        customModelGroup.position.y += size.y * scale * 0.5;

        humanMesh = null;
        customModelGroup.traverse((child) => {
            if (child.isMesh) {
                if (!humanMesh) humanMesh = child;
            }
        });

        scene.add(customModelGroup);
        statusLoader.style.opacity = '0';

        if (tattooTexture) {
            projectToCenter();
            applyTattoo();
        }
    }

    gltfLoader.load(
        DEFAULT_MODEL_URL,
        (gltf) => { setupLoadedModel(gltf.scene); },
        undefined,
        (error) => {
            console.error("Error al cargar modelo:", error);
            statusLoader.innerText = "Error cargando modelo";
        }
    );

    function removeWhiteBackground(img) {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 215 && data[i + 1] > 215 && data[i + 2] > 215) {
                data[i + 3] = 0;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    tattooInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const processedCanvas = removeWhiteBackground(img);
                
                const texture = new THREE.CanvasTexture(processedCanvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                tattooTexture = texture;

                scaleInput.disabled = false;
                rotateInput.disabled = false;
                btnRemove.disabled = false;
                tattooLabel.innerText = "Cambiar Tatuaje";

                projectToCenter();
                applyTattoo();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function projectToCenter() {
        if (!humanMesh && !customModelGroup) return;
        
        raycaster.set(new THREE.Vector3(0, 1.25, 2), new THREE.Vector3(0, 0, -1));
        const target = customModelGroup || humanMesh;
        const intersects = raycaster.intersectObject(target, true);

        if (intersects.length > 0) {
            lastHitPoint = intersects[0].point.clone();
            lastHitNormal = intersects[0].face.normal.clone();
            lastHitNormal.transformDirection(intersects[0].object.matrixWorld).normalize();
            humanMesh = intersects[0].object;
        } else {
            lastHitPoint = new THREE.Vector3(0, 1.25, 0.18);
            lastHitNormal = new THREE.Vector3(0, 0, 1);
        }
    }

    function applyTattoo() {
        if (!humanMesh || !tattooTexture || !lastHitPoint || !lastHitNormal) return;

        if (decalMesh) {
            scene.remove(decalMesh);
            decalMesh.geometry.dispose();
            if (decalMesh.material.map) decalMesh.material.map.dispose();
            decalMesh.material.dispose();
            decalMesh = null;
        }

        const position = lastHitPoint.clone();
        
        const eye = position.clone().add(lastHitNormal);
        const rotationMatrix = new THREE.Matrix4();
        rotationMatrix.lookAt(eye, position, new THREE.Vector3(0, 1, 0));

        const orientation = new THREE.Euler();
        orientation.setFromRotationMatrix(rotationMatrix);
        orientation.z += (decalParams.rotation * Math.PI) / 180;

        const size = new THREE.Vector3(
            decalParams.scale, 
            decalParams.scale, 
            decalParams.scale * 1.5
        );

        const decalGeometry = new DecalGeometry(
            humanMesh,
            position,
            orientation,
            size
        );

        const decalMaterial = new THREE.MeshPhongMaterial({
            map: tattooTexture,
            transparent: true,
            opacity: decalParams.opacity,
            depthTest: true,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -10,
            shininess: 0
        });

        decalMesh = new THREE.Mesh(decalGeometry, decalMaterial);
        scene.add(decalMesh);
    }

    function updateMouseCoords(e) {
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
    }

    function checkMeshIntersect() {
        if (!humanMesh && !customModelGroup) return null;
        raycaster.setFromCamera(mouse, camera);
        const target = customModelGroup || humanMesh;
        const intersects = raycaster.intersectObject(target, true);
        return intersects.length > 0 ? intersects[0] : null;
    }

    container.addEventListener('pointerdown', (e) => {
        if (!tattooTexture) return;

        updateMouseCoords(e);
        const hit = checkMeshIntersect();

        if (hit) {
            isDraggingTattoo = true;
            controls.enabled = false;
            container.classList.add('dragging');

            lastHitPoint = hit.point.clone();
            lastHitNormal = hit.face.normal.clone();
            lastHitNormal.transformDirection(hit.object.matrixWorld).normalize();
            humanMesh = hit.object;

            applyTattoo();
        }
    });

    container.addEventListener('pointermove', (e) => {
        if (!isDraggingTattoo || !tattooTexture) return;

        updateMouseCoords(e);
        const hit = checkMeshIntersect();

        if (hit) {
            lastHitPoint = hit.point.clone();
            lastHitNormal = hit.face.normal.clone();
            lastHitNormal.transformDirection(hit.object.matrixWorld).normalize();
            humanMesh = hit.object;

            applyTattoo();
        }
    });

    const stopDragging = () => {
        if (isDraggingTattoo) {
            isDraggingTattoo = false;
            controls.enabled = true;
            container.classList.remove('dragging');
        }
    };

    container.addEventListener('pointerup', stopDragging);
    container.addEventListener('pointerleave', stopDragging);

    scaleInput.addEventListener('input', (e) => {
        decalParams.scale = parseFloat(e.target.value);
        valScale.innerText = `${Math.round(decalParams.scale * 100)}%`;
        applyTattoo();
    });

    rotateInput.addEventListener('input', (e) => {
        decalParams.rotation = parseInt(e.target.value);
        valRotate.innerText = `${decalParams.rotation}°`;
        applyTattoo();
    });

    btnRemove.addEventListener('click', () => {
        if (decalMesh) {
            scene.remove(decalMesh);
            decalMesh.geometry.dispose();
            decalMesh = null;
        }
        lastHitPoint = null;
        lastHitNormal = null;
        tattooTexture = null;
        scaleInput.disabled = true;
        rotateInput.disabled = true;
        btnRemove.disabled = true;
        tattooLabel.innerText = "Subir Tatuaje";
    });

    // Acción WhatsApp + Captura de respaldo
    btnWhatsapp.addEventListener('click', () => {
        renderer.render(scene, camera);
        const imageURI = renderer.domElement.toDataURL('image/png');

        // Descarga automática de la referencia
        const link = document.createElement('a');
        link.download = 'simulacion-tatuaje-3d.png';
        link.href = imageURI;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Enlace WhatsApp
        const message = encodeURIComponent("Este es el diseño de referencia, con su medida y ubicacion precisa");
        const waUrl = `https://wa.me/message/MA2C4XCVWNKTM1?text=${message}`;
        
        window.open(waUrl, '_blank');
    });

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
