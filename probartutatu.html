<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Tatuaje 3D | Broder Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --panel-border: #242424;
            --panel-hover: #1e1e1e;
            --text-primary: #f5f5f5;
            --text-muted: #8e8e93;
            --accent: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --danger: #e54d42;
            --danger-bg: rgba(229, 77, 66, 0.1);
            --font-main: 'Helvetica Neue', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.02em;
        }

        .simulator-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1180px;
        }

        /* Panel Lateral de Control */
        .controls {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-badge {
            font-size: 0.75rem;
            color: var(--text-primary);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            background: #202020;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        input[type="file"] { display: none; }

        /* Estilo Dropzone / Upload Button */
        .upload-dropzone {
            border: 1px dashed var(--panel-border);
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .upload-dropzone:hover {
            border-color: #555555;
            background-color: var(--panel-hover);
            transform: translateY(-1px);
        }

        .upload-dropzone svg {
            width: 22px;
            height: 22px;
            fill: var(--text-muted);
            transition: fill 0.2s ease;
        }

        .upload-dropzone:hover svg {
            fill: var(--text-primary);
        }

        .upload-dropzone span {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .upload-dropzone small {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Sliders */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .range-slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #282828;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        input[type="range"]:hover:not(:disabled) {
            background: #383838;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type="range"]:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Botones de Acción */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #222222;
            color: var(--text-primary);
            border: 1px solid var(--panel-border);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-action:hover:not(:disabled) {
            border-color: #444444;
            background-color: #2a2a2a;
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: transparent;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid rgba(229, 77, 66, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--danger-bg);
            border-color: var(--danger);
        }

        .btn-download {
            background-color: var(--accent);
            color: #000000;
            border: none;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        .btn-download:hover {
            background-color: #e5e5e5;
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* Canvas Wrapper & Feedback Floating Elements */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 520px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            min-height: 520px;
            cursor: grab;
        }

        #webgl-container.dragging {
            cursor: grabbing;
        }

        .status-loader {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-primary);
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .instruction-tag {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
            white-space: nowrap;
        }

        .divider {
            border: 0;
            height: 1px;
            background: var(--panel-border);
            margin: 4px 0;
        }

        @media (min-width: 860px) {
            .simulator-container { flex-direction: row; }
            .controls { width: 320px; flex-shrink: 0; }
            .canvas-wrapper { flex: 1; min-height: 640px; }
            #webgl-container { min-height: 640px; }
            .instruction-tag { left: 16px; transform: none; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <header>
        <h1>Simulador de Tatuajes 3D</h1>
        <p>Proyección Anatómica en Tiempo Real — Broder Academy</p>
    </header>

    <div class="simulator-container">
        <aside class="controls">
            
            <!-- Carga de Archivos -->
            <div class="control-section">
                <span class="section-title">1. Diseño del Tatuaje</span>
                <label for="tattooInput" class="upload-dropzone">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <span id="tattooLabel">Subir Tatuaje</span>
                    <small>PNG (Fondo Transparente) / JPG</small>
                </label>
                <input type="file" id="tattooInput" accept="image/png, image/jpeg, image/webp">
            </div>

            <div class="control-section">
                <span class="section-title">2. Modelo 3D (.GLB)</span>
                <label for="modelInput" class="upload-dropzone" style="padding: 10px;">
                    <span style="font-size: 0.78rem;">Cargar Modelo Personalizado</span>
                </label>
                <input type="file" id="modelInput" accept=".glb, .gltf">
            </div>

            <hr class="divider">

            <!-- Ajustes de Estampa -->
            <div class="control-section">
                <div class="section-title">
                    <span>Tamaño / Escala</span>
                    <span id="valScale" class="value-badge">25%</span>
                </div>
                <div class="range-slider">
                    <input type="range" id="scale" min="0.05" max="0.8" step="0.01" value="0.25" disabled>
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">
                    <span>Rotación</span>
                    <span id="valRotate" class="value-badge">0°</span>
                </div>
                <div class="range-slider">
                    <input type="range" id="rotate" min="0" max="360" value="0" disabled>
                </div>
            </div>

            <div class="control-section">
                <div class="section-title">
                    <span>Opacidad (Tinta)</span>
                    <span id="valOpacity" class="value-badge">85%</span>
                </div>
                <div class="range-slider">
                    <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.85" disabled>
                </div>
            </div>

            <hr class="divider">

            <!-- Botones de Acción -->
            <button id="btnRemove" class="btn-action btn-danger" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Eliminar Tatuaje
            </button>
            <button id="btnDownload" class="btn-action btn-download">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Descargar Captura
            </button>
        </aside>

        <main class="canvas-wrapper">
            <div id="statusLoader" class="status-loader">Cargando modelo anatómico...</div>
            <div id="webgl-container"></div>
            <div class="instruction-tag">💡 Haz clic y arrastra sobre la piel para mover el tatuaje | Rotar vista con el mouse</div>
        </main>
    </div>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('webgl-container');
    const statusLoader = document.getElementById('statusLoader');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x141414);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0.9, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.9, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff8ee, 1.3);
    dirLight1.position.set(2, 4, 3);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xebf2ff, 0.6);
    dirLight2.position.set(-2, 2, -3);
    scene.add(dirLight2);

    let humanMesh = null;
    let customModelGroup = null;
    let tattooTexture = null;
    let decalMesh = null;
    let isDraggingTattoo = false;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let lastHitPoint = null;
    let lastHitNormal = null;

    const decalParams = { scale: 0.25, rotation: 0, opacity: 0.85 };

    const tattooInput = document.getElementById('tattooInput');
    const modelInput = document.getElementById('modelInput');
    const tattooLabel = document.getElementById('tattooLabel');
    const scaleInput = document.getElementById('scale');
    const rotateInput = document.getElementById('rotate');
    const opacityInput = document.getElementById('opacity');
    const btnRemove = document.getElementById('btnRemove');
    const btnDownload = document.getElementById('btnDownload');

    // UI Badges
    const valScale = document.getElementById('valScale');
    const valRotate = document.getElementById('valRotate');
    const valOpacity = document.getElementById('valOpacity');

    const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xe0ba9e,
        roughness: 0.55,
        metalness: 0.0
    });

    const gltfLoader = new GLTFLoader();

    const DEFAULT_MODEL_URL = 'https://cdn.jsdelivr.net/gh/marianocabraltattoo/broderacademy@0b6625f3c005149981e2f7f916e48cf34b8ddb2a/sculpting_a_human_body.glb';

    function setupLoadedModel(gltfGroup) {
        if (customModelGroup) scene.remove(customModelGroup);
        if (humanMesh) scene.remove(humanMesh);

        customModelGroup = gltfGroup;

        const box = new THREE.Box3().setFromObject(customModelGroup);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.0 / maxDim;
        customModelGroup.scale.setScalar(scale);

        box.setFromObject(customModelGroup);
        box.getCenter(center);
        customModelGroup.position.sub(center);
        customModelGroup.position.y += size.y * scale * 0.5;

        humanMesh = null;
        customModelGroup.traverse((child) => {
            if (child.isMesh) {
                if (!humanMesh) humanMesh = child;
            }
        });

        scene.add(customModelGroup);
        statusLoader.style.opacity = '0';

        if (tattooTexture) {
            projectToCenter();
            applyTattoo();
        }
    }

    gltfLoader.load(
        DEFAULT_MODEL_URL,
        (gltf) => {
            setupLoadedModel(gltf.scene);
        },
        undefined,
        (error) => {
            console.error("Error al cargar modelo por defecto desde GitHub:", error);
            statusLoader.innerText = "Error cargando modelo";
        }
    );

    modelInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        statusLoader.innerText = "Cargando modelo local...";
        statusLoader.style.opacity = '1';

        const url = URL.createObjectURL(file);
        gltfLoader.load(url, (gltf) => {
            setupLoadedModel(gltf.scene);
        });
    });

    function removeWhiteBackground(img) {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 215 && data[i + 1] > 215 && data[i + 2] > 215) {
                data[i + 3] = 0;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    tattooInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const processedCanvas = removeWhiteBackground(img);
                
                const texture = new THREE.CanvasTexture(processedCanvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                tattooTexture = texture;

                scaleInput.disabled = false;
                rotateInput.disabled = false;
                opacityInput.disabled = false;
                btnRemove.disabled = false;
                tattooLabel.innerText = "Cambiar Tatuaje";

                projectToCenter();
                applyTattoo();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function projectToCenter() {
        if (!humanMesh && !customModelGroup) return;
        
        raycaster.set(new THREE.Vector3(0, 1.25, 2), new THREE.Vector3(0, 0, -1));
        const target = customModelGroup || humanMesh;
        const intersects = raycaster.intersectObject(target, true);

        if (intersects.length > 0) {
            lastHitPoint = intersects[0].point.clone();
            lastHitNormal = intersects[0].face.normal.clone();
            lastHitNormal.transformDirection(intersects[0].object.matrixWorld).normalize();
            humanMesh = intersects[0].object;
        } else {
            lastHitPoint = new THREE.Vector3(0, 1.25, 0.18);
            lastHitNormal = new THREE.Vector3(0, 0, 1);
        }
    }

    function applyTattoo() {
        if (!humanMesh || !tattooTexture || !lastHitPoint || !lastHitNormal) return;

        if (decalMesh) {
            scene.remove(decalMesh);
            decalMesh.geometry.dispose();
            if (decalMesh.material.map) decalMesh.material.map.dispose();
            decalMesh.material.dispose();
            decalMesh = null;
        }

        const position = lastHitPoint.clone();
        
        const eye = position.clone().add(lastHitNormal);
        const rotationMatrix = new THREE.Matrix4();
        rotationMatrix.lookAt(eye, position, new THREE.Vector3(0, 1, 0));

        const orientation = new THREE.Euler();
        orientation.setFromRotationMatrix(rotationMatrix);
        orientation.z += (decalParams.rotation * Math.PI) / 180;

        const size = new THREE.Vector3(
            decalParams.scale, 
            decalParams.scale, 
            decalParams.scale * 1.5
        );

        const decalGeometry = new DecalGeometry(
            humanMesh,
            position,
            orientation,
            size
        );

        const decalMaterial = new THREE.MeshPhongMaterial({
            map: tattooTexture,
            transparent: true,
            opacity: decalParams.opacity,
            depthTest: true,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -10,
            shininess: 0
        });

        decalMesh = new THREE.Mesh(decalGeometry, decalMaterial);
        scene.add(decalMesh);
    }

    function updateMouseCoords(e) {
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
    }

    function checkMeshIntersect() {
        if (!humanMesh && !customModelGroup) return null;
        raycaster.setFromCamera(mouse, camera);
        const target = customModelGroup || humanMesh;
        const intersects = raycaster.intersectObject(target, true);
        return intersects.length > 0 ? intersects[0] : null;
    }

    container.addEventListener('pointerdown', (e) => {
        if (!tattooTexture) return;

        updateMouseCoords(e);
        const hit = checkMeshIntersect();

        if (hit) {
            isDraggingTattoo = true;
            controls.enabled = false;
            container.classList.add('dragging');

            lastHitPoint = hit.point.clone();
            lastHitNormal = hit.face.normal.clone();
            lastHitNormal.transformDirection(hit.object.matrixWorld).normalize();
            humanMesh = hit.object;

            applyTattoo();
        }
    });

    container.addEventListener('pointermove', (e) => {
        if (!isDraggingTattoo || !tattooTexture) return;

        updateMouseCoords(e);
        const hit = checkMeshIntersect();

        if (hit) {
            lastHitPoint = hit.point.clone();
            lastHitNormal = hit.face.normal.clone();
            lastHitNormal.transformDirection(hit.object.matrixWorld).normalize();
            humanMesh = hit.object;

            applyTattoo();
        }
    });

    const stopDragging = () => {
        if (isDraggingTattoo) {
            isDraggingTattoo = false;
            controls.enabled = true;
            container.classList.remove('dragging');
        }
    };

    container.addEventListener('pointerup', stopDragging);
    container.addEventListener('pointerleave', stopDragging);

    // Eventos Sliders con Feedback UI
    scaleInput.addEventListener('input', (e) => {
        decalParams.scale = parseFloat(e.target.value);
        valScale.innerText = `${Math.round(decalParams.scale * 100)}%`;
        applyTattoo();
    });

    rotateInput.addEventListener('input', (e) => {
        decalParams.rotation = parseInt(e.target.value);
        valRotate.innerText = `${decalParams.rotation}°`;
        applyTattoo();
    });

    opacityInput.addEventListener('input', (e) => {
        decalParams.opacity = parseFloat(e.target.value);
        valOpacity.innerText = `${Math.round(decalParams.opacity * 100)}%`;
        if (decalMesh) decalMesh.material.opacity = decalParams.opacity;
    });

    btnRemove.addEventListener('click', () => {
        if (decalMesh) {
            scene.remove(decalMesh);
            decalMesh.geometry.dispose();
            decalMesh = null;
        }
        lastHitPoint = null;
        lastHitNormal = null;
        tattooTexture = null;
        scaleInput.disabled = true;
        rotateInput.disabled = true;
        opacityInput.disabled = true;
        btnRemove.disabled = true;
        tattooLabel.innerText = "Subir Tatuaje";
    });

    btnDownload.addEventListener('click', () => {
        renderer.render(scene, camera);
        const imageURI = renderer.domElement.toDataURL('image/png');

        const link = document.createElement('a');
        link.download = 'simulacion-tatuaje-3d.png';
        link.href = imageURI;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
