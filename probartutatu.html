<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador de Tatuajes | Broder Academy</title>

    <!-- Favicon principal .ico -->
    <link rel="icon" type="image/x-icon" href="https://lh3.googleusercontent.com/d/1gSftLgTXTauVRdjDaK11ShpH5SCSPKQf">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ----------------------------------------------------
           BLOQUEO TOTAL DE SELECCIÓN Y MENÚS EN MÓVILES/DESKTOP
        ---------------------------------------------------- */
        *, *::before, *::after {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;

            /* Deshabilitar selección de texto */
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;

            /* Eliminar recuadro/resaltado azul o gris al tocar en iOS/Android */
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important; /* Desactiva el menú al mantener presionado */
        }

        img, svg {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --panel-border: #242424;
            --panel-hover: #1e1e1e;
            --text-primary: #f5f5f5;
            --text-muted: #8e8e93;
            --accent: #ffffff;
            --danger: #e54d42;
            --danger-bg: rgba(229, 77, 66, 0.1);
            --font-main: 'Helvetica Neue', 'Inter', -apple-system, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        header p a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        header p a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .simulator-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 1180px;
            position: relative;
        }

        /* Canvas Wrapper */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
            min-height: 440px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            touch-action: none; /* Previene scroll por gestos sobre el canvas */
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        #webgl-container.dragging {
            cursor: grabbing;
        }

        /* Botón Cargar Flotante */
        .floating-upload-btn {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .floating-upload-btn:hover {
            transform: scale(1.03);
            background: #ffffff;
        }

        .floating-upload-btn svg {
            width: 18px;
            height: 18px;
            fill: #000;
            pointer-events: none;
        }

        /* Widget de Control 3D (Trackpad Flotante) */
        .viewport-orbit-controller {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            touch-action: none;
        }

        .orbit-pad {
            width: 110px;
            height: 110px;
            background: rgba(20, 20, 20, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            touch-action: none;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .orbit-pad:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .orbit-pad:active {
            cursor: grabbing;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
        }

        .orbit-pad-center {
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .orbit-pad-center svg {
            width: 22px;
            height: 22px;
            fill: var(--text-primary);
            opacity: 0.9;
        }

        .orbit-pad-label {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .orbit-actions {
            display: flex;
            gap: 6px;
            background: rgba(20, 20, 20, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .cam-btn {
            width: 32px;
            height: 32px;
            background: #1e1e1e;
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .cam-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }

        .cam-btn:active {
            transform: scale(0.92);
            background: #333;
        }

        .cam-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--text-primary);
        }

        /* Panel Lateral de Controles */
        .controls {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-badge {
            font-size: 0.75rem;
            color: var(--text-primary);
            font-weight: 600;
            background: #202020;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        input[type="file"] { display: none; }

        /* Sliders */
        .range-slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #282828;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        input[type="range"]:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Botones de Acción */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            border-color: transparent;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid rgba(229, 77, 66, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--danger-bg);
            border-color: var(--danger);
        }

        .btn-download {
            background-color: #ffffff;
            color: #000000;
            border: none;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
        }

        .btn-download:hover {
            background-color: #e2e2e2;
            transform: translateY(-1px);
        }

        .status-loader {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-primary);
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 15;
        }

        .instruction-tag {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 15;
        }

        .divider {
            border: 0;
            height: 1px;
            background: var(--panel-border);
        }

        /* Estilos del Footer */
        .footer {
            margin-top: 40px;
            padding: 24px 0 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .social-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            transition: all 0.2s ease;
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
            transition: fill 0.2s ease;
        }

        .social-icon:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background-color: var(--panel-hover);
        }

        .social-icon:hover svg {
            fill: var(--text-primary);
        }

        .copyright {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Desktop Adjustments */
        @media (min-width: 860px) {
            .simulator-container { flex-direction: row; }
            .controls { width: 320px; flex-shrink: 0; height: fit-content; }
            .canvas-wrapper { flex: 1; height: 680px; }
            .floating-upload-btn {
                position: relative;
                bottom: auto;
                left: auto;
                border-radius: 8px;
                width: 100%;
                justify-content: center;
                background: #1e1e1e;
                color: var(--text-primary);
                border: 1px solid var(--panel-border);
                padding: 12px;
                box-shadow: none;
            }
            .floating-upload-btn:hover {
                background: #2a2a2a;
            }
            .floating-upload-btn svg { fill: var(--text-primary); }
        }
    </style>

    <!-- SCRIPT DE BLOQUEO DE SELECCIÓN VÍA JS -->
    <script>
        // Bloquea el menú contextual en toda la aplicación (evita "Copiar", "Guardar Imagen", etc.)
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        }, false);

        // Bloquea arrastre nativo de elementos del navegador
        document.addEventListener('dragstart', function (e) {
            e.preventDefault();
        }, false);

        // Previene la selección por gestos en iOS / Android al mantener presionado
        document.addEventListener('selectstart', function (e) {
            e.preventDefault();
        }, false);
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('webgl-container');
    const statusLoader = document.getElementById('statusLoader');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x141414);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    const initialCamPos = new THREE.Vector3(0, 0.9, 3.2);
    const initialTarget = new THREE.Vector3(0, 0.9, 0);
    camera.position.copy(initialCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // OrbitControls se restringe al Pad Flotante
    const orbitTrackpad = document.getElementById('orbitTrackpad');
    const controls = new OrbitControls(camera, orbitTrackpad);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.copy(initialTarget);
    controls.enableZoom = false;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff8ee, 1.3);
    dirLight1.position.set(2, 4, 3);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xebf2ff, 0.6);
    dirLight2.position.set(-2, 2, -3);
    scene.add(dirLight2);

    let humanMesh = null;
    let customModelGroup = null;
    let tattooTexture = null;
    let decalMesh = null;
    let isDraggingTattoo = false;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let lastHitPoint = null;
    let lastHitNormal = null;

    const decalParams = { scale: 0.25, rotation: 0, opacity: 0.85 };

    const tattooInput = document.getElementById('tattooInput');
    const tattooLabel = document.getElementById('tattooLabel');
    const scaleInput = document.getElementById('scale');
    const rotateInput = document.getElementById('rotate');
    const btnRemove = document.getElementById('btnRemove');
    const btnDownload = document.getElementById('btnDownload');
    const btnResetCam = document.getElementById('btnResetCam');

    const valScale = document.getElementById('valScale');
    const valRotate = document.getElementById('valRotate');

    const gltfLoader = new GLTFLoader();
    const DEFAULT_MODEL_URL = 'https://cdn.jsdelivr.net/gh/marianocabraltattoo/broderacademy@0b6625f3c005149981e2f7f916e48cf34b8ddb2a/sculpting_a_human_body.glb';

    function setupLoadedModel(gltfGroup) {
        if (customModelGroup) scene.remove(customModelGroup);
        if (humanMesh) scene.remove(humanMesh);

        customModelGroup = gltfGroup;

        const box = new THREE.Box3().setFromObject(customModelGroup);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.0 / maxDim;
        customModelGroup.scale.setScalar(scale);

        box.setFromObject(customModelGroup);
        box.getCenter(center);
        customModelGroup.position.sub(center);
        customModelGroup.position.y += size.y * scale * 0.5;

        humanMesh = null;
        customModelGroup.traverse((child) => {
            if (child.isMesh) {
                if (!humanMesh) humanMesh = child;
            }
        });

        scene.add(customModelGroup);
        statusLoader.style.opacity = '0';

        if (tattooTexture) {
            projectToCenter();
            applyTattoo();
        }
    }

    gltfLoader.load(
        DEFAULT_MODEL_URL,
        (gltf) => { setupLoadedModel(gltf.scene); },
        undefined,
        (error) => {
            console.error("Error al cargar modelo:", error);
            statusLoader.innerText = "Error cargando modelo";
        }
    );

    function removeWhiteBackground(img) {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 215 && data[i + 1] > 215 && data[i + 2] > 215) {
                data[i + 3] = 0;
            }
        }

        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    tattooInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const processedCanvas = removeWhiteBackground(img);
                
                const texture = new THREE.CanvasTexture(processedCanvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                tattooTexture = texture;

                scaleInput.disabled = false;
                rotateInput.disabled = false;
                btnRemove.disabled = false;
                tattooLabel.innerText = "Cambiar Tatuaje";

                projectToCenter();
                applyTattoo();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function projectToCenter() {
        if (!humanMesh && !customModelGroup) return;
        
        raycaster.set(new THREE.Vector3(0, 1.25, 2), new THREE.Vector3(0, 0, -1));
        const target = customModelGroup || humanMesh;
        const intersects = raycaster.intersectObject(target, true);

        if (intersects.length > 0) {
            lastHitPoint = intersects[0].point.clone();
            lastHitNormal = intersects[0].face.normal.clone();
            lastHitNormal.transformDirection(intersects[0].object.matrixWorld).normalize();
            humanMesh = intersects[0].object;
        } else {
            lastHitPoint = new THREE.Vector3(0, 1.25, 0.18);
            lastHitNormal = new THREE.Vector3(0, 0, 1);
        }
    }

    function applyTattoo() {
        if (!humanMesh || !tattooTexture || !lastHitPoint || !lastHitNormal) return;

        if (decalMesh) {
            scene.remove(decalMesh);
            decalMesh.geometry.dispose();
            if (decalMesh.material.map) decalMesh.material.map.dispose();
            decalMesh.material.dispose();
            decalMesh = null;
        }

        const position = lastHitPoint.clone();
        
        const eye = position.clone().add(lastHitNormal);
        const rotationMatrix = new THREE.Matrix4();
        rotationMatrix.lookAt(eye, position, new THREE.Vector3(0, 1, 0));

        const orientation = new THREE.Euler();
        orientation.setFromRotationMatrix(rotationMatrix);
        orientation.z += (decalParams.rotation * Math.PI) / 180;

        const size = new THREE.Vector3(
            decalParams.scale, 
            decalParams.scale, 
            decalParams.scale * 1.5
        );

        const decalGeometry = new DecalGeometry(
            humanMesh,
            position,
            orientation,
            size
        );

        const decalMaterial = new THREE.MeshPhongMaterial({
            map: tattooTexture,
            transparent: true,
            opacity: decalParams.opacity,
            depthTest: true,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -10,
            shininess: 0
        });

        decalMesh = new THREE.Mesh(decalGeometry, decalMaterial);
        scene.add(decalMesh);
    }

    function updateMouseCoords(e) {
        const rect = container.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;
    }

    function checkMeshIntersect() {
        if (!humanMesh && !customModelGroup) return null;
        raycaster.setFromCamera(mouse, camera);
        const target = customModelGroup || humanMesh;
        const intersects = raycaster.intersectObject(target, true);
        return intersects.length > 0 ? intersects[0] : null;
    }

    let initialPinchDistance = null;

    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            isDraggingTattoo = false;
            container.classList.remove('dragging');
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialPinchDistance = Math.hypot(dx, dy);
        }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDistance) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const currentPinchDistance = Math.hypot(dx, dy);

            const zoomFactor = initialPinchDistance / currentPinchDistance;
            
            const dir = camera.position.clone().sub(controls.target);
            const newDist = dir.length() * (zoomFactor > 1 ? 1.03 : 0.97);

            if (newDist >= 1.2 && newDist <= 6.0) {
                dir.setLength(newDist);
                camera.position.copy(controls.target).add(dir);
            }

            initialPinchDistance = currentPinchDistance;
        }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
            initialPinchDistance = null;
        }
    });

    container.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.viewport-orbit-controller') || e.target.closest('.floating-upload-btn')) {
            return;
        }

        if (e.pointerType === 'touch' && e.isPrimary === false) return;
        
        updateMouseCoords(e);
        const hit = checkMeshIntersect();

        if (hit) {
            isDraggingTattoo = true;
            container.classList.add('dragging');

            lastHitPoint = hit.point.clone();
            lastHitNormal = hit.face.normal.clone();
            lastHitNormal.transformDirection(hit.object.matrixWorld).normalize();
            humanMesh = hit.object;

            if (tattooTexture) {
                applyTattoo();
            }
        }
    });

    container.addEventListener('pointermove', (e) => {
        if (!isDraggingTattoo) return;

        updateMouseCoords(e);
        const hit = checkMeshIntersect();

        if (hit) {
            lastHitPoint = hit.point.clone();
            lastHitNormal = hit.face.normal.clone();
            lastHitNormal.transformDirection(hit.object.matrixWorld).normalize();
            humanMesh = hit.object;

            if (tattooTexture) {
                applyTattoo();
            }
        }
    });

    window.addEventListener('pointerup', () => {
        isDraggingTattoo = false;
        container.classList.remove('dragging');
    });

    scaleInput.addEventListener('input', (e) => {
        decalParams.scale = parseFloat(e.target.value);
        valScale.innerText = `${Math.round((decalParams.scale / 0.8) * 100)}%`;
        applyTattoo();
    });

    rotateInput.addEventListener('input', (e) => {
        decalParams.rotation = parseFloat(e.target.value);
        valRotate.innerText = `${decalParams.rotation}°`;
        applyTattoo();
    });

    btnRemove.addEventListener('click', () => {
        if (decalMesh) {
            scene.remove(decalMesh);
            decalMesh.geometry.dispose();
            decalMesh.material.dispose();
            decalMesh = null;
        }
        tattooTexture = null;
        tattooInput.value = '';
        scaleInput.disabled = true;
        rotateInput.disabled = true;
        btnRemove.disabled = true;
        tattooLabel.innerText = "Subir Tatuaje";
    });

    btnResetCam.addEventListener('click', () => {
        camera.position.copy(initialCamPos);
        controls.target.copy(initialTarget);
        controls.update();
    });

    btnDownload.addEventListener('click', () => {
        renderer.render(scene, camera);
        const dataURL = renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'simulacion-tatuaje-broder.png';
        link.href = dataURL;
        link.click();
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
    </script>
</body>
</html>
